# Docker Compose >= 2.30, one environment per VPS. Native host Caddy owns 80/443.
name: dartspoint-${DEPLOY_ENV:?DEPLOY_ENV required}
x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  web:
    <<: *runtime
    image: ${WEB_IMAGE:?WEB_IMAGE required}
    env_file:
      - path: ${RELEASE_DIR:?RELEASE_DIR required}/web.env
        format: raw
    environment: {PORT: "3000"}
    ports: ["127.0.0.1:4300:3000"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  realtime:
    <<: *runtime
    image: ${REALTIME_IMAGE:?REALTIME_IMAGE required}
    env_file:
      - path: ${RELEASE_DIR}/realtime.env
        format: raw
    environment: {PORT: "2567"}
    ports: ["127.0.0.1:42567:2567"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2567/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *runtime
    image: ${WORKER_IMAGE:?WORKER_IMAGE required}
    env_file:
      - path: ${RELEASE_DIR}/worker.env
        format: raw
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, scripts/health.mjs]
      interval: 10s
      timeout: 5s
      retries: 12
  migrate:
    <<: *runtime
    restart: "no"
    profiles: [operations]
    image: ${WORKER_IMAGE:?WORKER_IMAGE required}
    env_file:
      - path: ${RELEASE_DIR}/migration.env
        format: raw
    command: [node, scripts/migrate.mjs, --expand-only]
  redis:
    image: ${REDIS_IMAGE:?Pin REDIS_IMAGE by digest}
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  redis-data:
# No Redis port is published. Add monitoring/capacity tuning after measurement.
