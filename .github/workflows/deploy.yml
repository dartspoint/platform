# Protected environment branches only. The target VPS never checks out/builds source.
name: Deploy DartsPoint
on:
  push:
    branches: [staging, production]
permissions: {}
concurrency:
  group: dartspoint-deploy-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ github.ref_name }}
    env:
      DEPLOY_ENV: ${{ github.ref_name }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_REALTIME_URL: ${{ vars.NEXT_PUBLIC_REALTIME_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the builder for attested image publication
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker-container
      - name: Publish exact commit for this environment
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/dartspoint-registry.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          python3 ops/scripts/build-release.py
      - name: Store public release identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dartspoint-release-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest/release.json
          if-no-files-found: error
          retention-days: 7
  deploy:
    name: Controlled deployment
    needs: [verify, publish]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production')
    runs-on: [self-hosted, Linux, X64, "${{ github.ref_name == 'staging' && 'dartspoint-staging' || 'dartspoint-production' }}"]
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    environment:
      name: ${{ github.ref_name }}
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Download only the public manifest from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dartspoint-release-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dartspoint-release
      - name: Deliver to the installed environment helper
        env:
          DEPLOY_ENV: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ runner.temp }}/dartspoint-release/release.json
          DATABASE_CA_CERT_BASE64: ${{ vars.DATABASE_CA_CERT_BASE64 }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REALTIME_URL: ${{ vars.NEXT_PUBLIC_REALTIME_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          RESTIC_REPOSITORY: ${{ vars.RESTIC_REPOSITORY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INTERNAL_DEPLOY_TOKEN: ${{ secrets.INTERNAL_DEPLOY_TOKEN }}
        run: /usr/bin/python3 -I /usr/local/libexec/dartspoint/delivery-entry.py
      - name: Remove downloaded public manifest
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/dartspoint-release"
# No privileged pull_request, checkout, dependency installation or build on target runners.
# Restrict runner groups/workflows and branch/environment administration outside YAML.
